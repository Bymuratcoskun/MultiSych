name: MultiSych CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --configuration Release --no-restore

    - name: Publish MultiSych Desktop
      run: dotnet publish MultiSych.Desktop/MultiSych.Desktop.csproj -c Release -o ./publish_output --no-build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MultiSych-Release-${{ runner.os }}
        path: ./publish_output/

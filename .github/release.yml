changelog:
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
        - breaking
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - bugfix
        - fix
    - title: Maintenance
      labels:
        - chore
        - dependencies
        - refactor
        - docs
    - title: Other Changes
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog
